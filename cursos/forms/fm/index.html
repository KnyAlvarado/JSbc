<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href="css/styles.css"> 
</head>
<body>
    <h1>Formulario html</h1>
    <form novalidate>
        <label for = "nombre">Nombre : </label>
        <input type = "text" id="nombre" name = "nombre" placeholder="Escribe tu Nombre" value = ""  required/>
        <br/><br/>
        <label for = "apellido">Apellido : </label>
        <input type = "text" id="apellido" name = "apellido" placeholder ="Escribe tu Apellido" value = "" required/>

        <input type = "submit"  value = "Enviar"/>
    </form>

    <br/>
    <hr/>
    <br/>
    <form >
        <label for = "nombre1">Nombre : </label>
        <input type = "text" id="nombre1" name = "nombre1" placeholder="Escribe tu Nombre" value = ""  required/>
        <br/><br/>
        <label for = "apellido1">Apellido : </label>
        <input type = "text" id="apellido1" name = "apellido1" placeholder ="Escribe tu Apellido" value = "" required/>

        <input type = "submit"  value = "Enviar"/>
        <input type = "submit" formnovalidate = "formnovalidate" value = "Enviar sin validar">
    </form>

    <br/>
    <hr/>
    <br/>
    <form method="GET">
        <label for = "nombre2">Nombre : </label>
        <input type = "text" id="nombre2" name = "nombre2" placeholder="Escribe tu Nombre" value = ""  required/>
        <br/><br/>
        <label for = "apellido2">Apellido : </label>
        <input type = "text" id="apellido2" name = "apellido2" placeholder ="Escribe tu Apellido" value = "" required/>

        <input type = "submit"  value = "Enviar"/>
        <input type = "submit" formnovalidate = "formnovalidate" value = "Enviar sin validar">
    </form>

    <br/>
    <hr/>
    <br/>
    <form action="mi_servidor" method="GET" target="_self" autocomplete="off">
        <fieldset>
            <legend>Datos Persona </legend>
            <label for = "idPersona">ID Persona : </label>
            <input type = "text" id = "idPersona" name = "idPersona" value="100" required readonly disabled/>
            <!-- <br/><br/> -->
             <!-- <label for = "idPersona">ID Persona : </label> -->
            <input type = "hidden" id = "sistema" name = "sistema" value="SAP"/>
            <br/><br/>
            <label for = "nombre2">Nombre : </label>
            <input type = "text" id="nombre2" name = "nombre2" placeholder="Escribe tu Nombre" value = ""  required/>
            <br/><br/>
            <label for = "apellido2">Apellido : </label>
            <input type = "text" id="apellido2" name = "apellido2" placeholder ="Escribe tu Apellido" value = "" required/>
            <br/><br/>
            <label for = "email">Email : </label>
            <input type = "email" id="email" name = "email" placeholder ="Escribe tu Email" value = "" required/>
            <br/><br/>
            <label for = "edad">Edad : </label>
            <input type = "number" id="edad" name = "edad" placeholder ="Escribe tu Edad" step="any" value = "" required/>
            <br/><br/>
            
            <label >Genero : </label>
            <br/>
            <input type = "radio" id="femenino" name = "genero"  value = "femenino" />
            <label for = "femenino">Femenino</label><br/>
            <input type = "radio" id="masculino" name = "genero"  value = "masculino" />
            <label for = "masculino">Masculino</label>
            <br/><br/>
            <label >Genero Musica : </label>
            <br/>
            <input type = "checkbox" id="clasica" name = "musica"  value = "clasica" />
            <label for = "clasica">Musica Clasica</label><br/>
            <input type = "checkbox" id="jazz" name = "genero"  value = "jazz" />
            <label for = "jazz">Jazz</label><br/>
            <br/>
            <label for = "autos">Marca de auto favorita</label>
            <br/>
            <select id = "autos" name = "autos">
                <option value = "volvo">VOLVO</option>
                <option value = "bmw">BMW</option>
                <option value = "audi" selected>AUDI</option>
                <option value = "ferrari">FERRARI</option>
            </select>
            <br/><br/>
            <label for = "comentario">Comentario</label><br/>
            <textarea id = "comentario" name = "comentario" rows = "2" cols = "30"> Este es el comentario</textarea>
            <br/><br/>
            <label for = "password">Password : </label>
            <input type = "password" id="password" name = "password" placeholder ="Escribe tu Password" value = "" required/>

            <input type = "submit"  value = "Enviar"/>
            <input type = "submit" formnovalidate = "formnovalidate" value = "Enviar sin validar">
            <input type = "reset" value="Restablecer"/>
        </fieldset>
        
    </form>
</body>
</html>
